# The original SkyGrid: the full base every other preset builds on.
algorithm: skygrid
spacing: 4
minY: -48
maxY: 120
noiseScale: 0.03
blocks:
  - { material: minecraft:stone, weight: 28.0 }
  - { material: minecraft:dirt, weight: 18.0 }
  - { material: minecraft:grass_block, weight: 14.0 }
  - { material: minecraft:oak_log, weight: 8.0 }
  - { material: minecraft:oak_leaves, weight: 6.0 }
  - { material: minecraft:sand, weight: 7.0 }
  - { material: minecraft:gravel, weight: 5.0 }
  - { material: minecraft:coal_ore, weight: 5.0 }
  - { material: minecraft:iron_ore, weight: 4.0 }
  - { material: minecraft:copper_ore, weight: 3.0 }
  - { material: minecraft:gold_ore, weight: 2.0 }
  - { material: minecraft:redstone_ore, weight: 2.0 }
  - { material: minecraft:lapis_ore, weight: 1.5 }
  - { material: minecraft:diamond_ore, weight: 1.0 }
  - { material: minecraft:obsidian, weight: 1.5 }
  - { material: minecraft:water, weight: 3.0 }
  - { material: minecraft:lava, weight: 1.5 }
  - { material: minecraft:moss_block, weight: 2.0 }
  - { material: minecraft:bookshelf, weight: 1.0 }
  - { material: minecraft:chest, weight: 1.5 }
  - { material: minecraft:spawner, weight: 0.6 }
chestLoot:
  - { material: minecraft:chests/simple_dungeon, weight: 4.0 }
  - { material: minecraft:chests/abandoned_mineshaft, weight: 2.0 }
  - { material: minecraft:chests/jungle_temple, weight: 1.0 }
spawnerMobs:
  - { material: minecraft:zombie, weight: 4.0 }
  - { material: minecraft:skeleton, weight: 3.0 }
  - { material: minecraft:spider, weight: 2.0 }
  - { material: minecraft:blaze, weight: 1.0 }
  - { material: minecraft:enderman, weight: 1.5 }
biomes:
  - minecraft:plains
  - minecraft:forest
  - minecraft:birch_forest
  - minecraft:dark_forest
  - minecraft:taiga
  - minecraft:snowy_plains
  - minecraft:desert
  - minecraft:savanna
  - minecraft:jungle
  - minecraft:swamp
spawn:
  spread: true
  spacing: 512
  platformY: 64
  platformBlock: minecraft:cobblestone
  platformRadius: 2
  villager: true
# The Wave Function Collapse rule set (used when algorithm is wfc). Inherited by every preset.
wfc:
  settings:
    cellSize: 4
    regionSize: 16
    surfaceY: 64
    maxSolverAttempts: 8
    fallbackTileId: grass
    allowSelf: true
  tiles:
    - { id: deep_water, weight: 3.0, neutral: false, surface: minecraft:water, fill: minecraft:sand, liquid: true, features: [] }
    - { id: water, weight: 6.0, neutral: true, surface: minecraft:water, fill: minecraft:sand, liquid: true, features: [] }
    - { id: sand, weight: 4.0, neutral: true, surface: minecraft:sand, fill: minecraft:sand, liquid: false, features: [] }
    - id: sugarcane
      weight: 2.5
      neutral: false
      surface: minecraft:grass_block
      fill: minecraft:dirt
      liquid: false
      features:
        - { type: plant, material: minecraft:sugar_cane, requiresLiquidNeighbor: false, requiresGroundBlock: "", probability: 0.5, minHeight: 1, maxHeight: 3, providesWater: true }
    - { id: grass, weight: 10.0, neutral: true, surface: minecraft:grass_block, fill: minecraft:dirt, liquid: false, features: [] }
    - id: flowers
      weight: 3.0
      neutral: false
      surface: minecraft:grass_block
      fill: minecraft:dirt
      liquid: false
      features:
        - { type: plant, material: minecraft:poppy, requiresLiquidNeighbor: false, requiresGroundBlock: minecraft:grass_block, probability: 0.45, minHeight: 1, maxHeight: 1, providesWater: false }
    - id: cactus
      weight: 2.0
      neutral: false
      surface: minecraft:sand
      fill: minecraft:sand
      liquid: false
      features:
        - { type: plant, material: minecraft:cactus, requiresLiquidNeighbor: false, requiresGroundBlock: minecraft:sand, probability: 0.25, minHeight: 1, maxHeight: 3, providesWater: false }
    - id: dirt
      weight: 2.0
      neutral: false
      surface: minecraft:coarse_dirt
      fill: minecraft:dirt
      liquid: false
      features:
        - { type: loot_chest, block: minecraft:chest, lootTable: minecraft:chests/simple_dungeon, probability: 0.12 }
        - { type: spawner, block: minecraft:spawner, mob: minecraft:zombie, probability: 0.06 }
  allowed:
    - [deep_water, water]
    - [water, sand]
    - [water, sugarcane]
    - [sand, grass]
    - [sand, cactus]
    - [sand, sugarcane]
    - [sand, dirt]
    - [sugarcane, grass]
    - [cactus, dirt]
    - [grass, flowers]
    - [grass, dirt]
    - [flowers, dirt]
