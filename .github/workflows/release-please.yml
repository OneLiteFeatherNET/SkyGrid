name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Attach release jar and upload SBOM
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Shared OneLiteFeather plugin publish workflow (CycloneDX SBOM upload only; Modrinth and
    # Hangar are not used by SkyGrid-ng).
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-plugin-publish.yml@v2.5.0
    with:
      java-version: "25"
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      project-name: "SkyGrid-ng"
      project-version: ${{ needs.release-please.outputs.version }}
      publish-task: "cyclonedxBom"
    secrets: inherit
