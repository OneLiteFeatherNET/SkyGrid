name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to Modrinth and Hangar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    # Shared OneLiteFeather plugin publish workflow (Modrinth + Hangar + CycloneDX SBOM).
    uses: OneLiteFeatherNET/workflows/.github/workflows/gradle-plugin-publish.yml@v2.4.0
    with:
      java-version: "25"
      tag-name: ${{ needs.release-please.outputs.tag_name }}
      project-name: "GridWFC"
      project-version: ${{ needs.release-please.outputs.version }}
    secrets: inherit
