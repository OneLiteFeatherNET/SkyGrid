name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to Modrinth and Hangar
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    env:
      MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
      HANGAR_API_TOKEN: ${{ secrets.HANGAR_API_TOKEN }}
      DTRACK_HOST: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
      - name: Build, publish and SBOM
        run: ./gradlew clean build modrinth publishAllPublicationsToHangar cyclonedxBom
      - name: Attach jar to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.release-please.outputs.tag_name }}
          files: build/libs/*.jar
      - name: Upload SBOM to Dependency-Track
        if: ${{ env.DTRACK_HOST != '' }}
        uses: DependencyTrack/gh-upload-sbom@v3
        with:
          serverhostname: ${{ secrets.DEPENDENCYTRACK_HOSTNAME }}
          apikey: ${{ secrets.DEPENDENCYTRACK_APIKEY }}
          projectname: "GridWFC"
          projectversion: ${{ needs.release-please.outputs.version }}
          projecttags: "bukkit,paper,plugin,worldgen,skygrid"
          bomfilename: "build/reports/cyclonedx/bom.xml"
          autocreate: true
