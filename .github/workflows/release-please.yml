name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds the shaded Paper jar and the CycloneDX SBOM. Nothing is published here.
  build:
    name: Build release artifacts
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build shaded jar and SBOM
        run: ./gradlew :platforms:paper:shadowJar cyclonedxBom

      - name: Upload plugin JAR
        uses: actions/upload-artifact@v7
        with:
          name: plugin-jar
          path: platforms/paper/build/libs/skygrid-ng-*.jar
          if-no-files-found: error
          retention-days: 14

      - name: Upload SBOM
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: build/reports/cyclonedx/bom.xml
          if-no-files-found: error
          retention-days: 14

  # Attaches the shaded jar to the GitHub release. No Modrinth or Hangar publishing.
  publish:
    name: Attach plugin JAR to release
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
    steps:
      - name: Download plugin JAR
        uses: actions/download-artifact@v8
        with:
          name: plugin-jar
          path: dist

      - name: Upload JAR to GitHub release
        run: gh release upload "$TAG_NAME" dist/skygrid-ng-*.jar --repo "$GITHUB_REPOSITORY" --clobber

  # Separate job so a Dependency-Track outage or a rejected API key cannot take the release down.
  sbom:
    name: Publish SBOM
    needs: [release-please, build]
    if: needs.release-please.outputs.release_created == 'true'
    uses: OneLiteFeatherNET/workflows/.github/workflows/sbom-publish.yml@v2.9.1
    with:
      project-name: "SkyGrid-ng"
      project-version: ${{ needs.release-please.outputs.version }}
      project-tags: "paper,plugin"
      artifact-name: "sbom"
      sbom-path: "bom.xml"
    secrets: inherit
