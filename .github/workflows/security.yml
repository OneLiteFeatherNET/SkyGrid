name: Security

# Report-only Trivy scan on main and a weekly sweep. Findings land in code scanning.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy:
    permissions:
      contents: read
      security-events: write
    uses: OneLiteFeatherNET/workflows/.github/workflows/security-scan.yml@v2.9.1
    with:
      scan-type: fs
      severity: "CRITICAL,HIGH"
      fail-on-findings: false
